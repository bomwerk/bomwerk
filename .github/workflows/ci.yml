name: ci
on:
  # A fork's pull request is the only way an outside contribution arrives, and
  # `push` alone never runs for one. `push` stays limited to main so a branch
  # with an open pull request is not built twice.
  pull_request:
  push:
    branches: [main]
  # Lets a run be started by hand, which is how the first one after publication
  # happens and how a green result is produced without an empty commit.
  workflow_dispatch:

jobs:
  public-history:
    # The repository's own history is checked on every change, not once at
    # publication: an old branch pushed here, a second root commit merged in,
    # or a path outside the public layout has to fail before it is anyone's
    # problem. fetch-depth 0 is required: the default shallow fetch would
    # hide exactly what this inspects.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit the public history
        run: python3 scripts/audit_public_history.py .git

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
    steps:
      - uses: actions/checkout@v4.1.0
        with:
          submodules: true
      - name: Resolve vcpkg baseline commit (cache key input)
        id: vcpkg_baseline
        run: echo "sha=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-bincache-${{ matrix.os }}-${{ steps.vcpkg_baseline.outputs.sha }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ matrix.os }}-${{ steps.vcpkg_baseline.outputs.sha }}-
            vcpkg-bincache-${{ matrix.os }}-
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh
      - name: Set up Python (cached)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: scripts/ci-requirements.txt
      - name: Install schema validation tooling
        run: python3 -m pip install --user --break-system-packages -r scripts/ci-requirements.txt
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DBOMWERK_PRO=OFF
          -DBOMWERK_SANITIZE=${{ matrix.os == 'ubuntu-24.04' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel
      - name: Cache sbom-tools binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/sbom-tools
          key: sbom-tools-${{ matrix.os }}-${{ hashFiles('scripts/fetch-sbom-tools.sh') }}
      - name: Install sbom-tools (CRANE interop)
        run: ./scripts/fetch-sbom-tools.sh
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke run (dogfood, our own vendored vcpkg submodule must appear)
        run: |
          set +e
          # --exclude-list keeps fixtures/ (real-world and hostile PARSER INPUT : 
          # several files literally named vcpkg.json/conanfile.txt/CMakeLists.txt/
          # conan.lock/.gitmodules) out of bomwerk's own dependency list; see
          # scripts/ci-self-scan-exclude.txt for why this can't just add
          # "fixtures" to the built-in list.
          ./build/bomwerk scan . --exclude-list scripts/ci-self-scan-exclude.txt > scan.out 2> scan.err
          code=$?
          set -e
          echo "=== exit code: $code ==="
          echo "=== stdout: $(wc -c < scan.out) bytes ==="
          cat scan.out
          echo "=== stderr: $(wc -c < scan.err) bytes ==="
          cat scan.err
          test "$code" -le 1
          grep -Eq 'pkg:github/microsoft/vcpkg@[0-9a-f]{40}' scan.out
          test -s sbom.cdx.json
          # The golden purl_spec_* ctests check hand-built fixtures; this
          # checks a REAL scan of a real repo, where the purls come from whatever
          # bomwerk's own dependencies happen to look like today.
          python3 scripts/validate_purls.py sbom.cdx.json
          # Two independent absence checks for the fixtures-exclusion fix, each
          # using an explicit if/exit rather than `!`-negation: bash's `set -e`
          # never aborts on a `!`-inverted command's status, so a `!`-prefixed
          # check here would silently stop guarding anything the moment one
          # more line was appended after it. harfbuzz is declared only by
          # fixtures/vuln/known-vulnerable's FetchContent; the hex string is a
          # purely synthetic commit id shared by two fixtures/golden/ cases
          # (never a real bomwerk dependency's commit): either appearing here
          # means the fixtures exclusion regressed.
          if grep -q 'harfbuzz' scan.out; then
            echo "fixtures/vuln/known-vulnerable leaked into bomwerk's own dependency list" >&2
            exit 1
          fi
          if grep -q '0f1e2d3c4b5a69788796a5b4c3d2e1f009182736' scan.out; then
            echo "a fixtures/golden/ fixture leaked into bomwerk's own dependency list" >&2
            exit 1
          fi

  fuzz-smoke:
    # A ten-minute libFuzzer campaign over every harness in tests/fuzz/ (T40,
    # docs/fuzzing.md): 600 s of wall clock on four cores, starting from the
    # corpus the nightly run saved on main. It only restores that corpus,
    # never saves it, so a pull request cannot change what main fuzzes from.
    # Any crash, leak, timeout or out-of-memory input fails the job and is
    # uploaded as an artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # A newer push to the same branch supersedes a campaign still running.
    concurrency:
      group: fuzz-smoke-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
    steps:
      - uses: actions/checkout@v4.1.0
        with:
          submodules: true
      - name: Resolve vcpkg baseline commit (cache key input)
        id: vcpkg_baseline
        run: echo "sha=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Same key as build-test on ubuntu-24.04: vcpkg builds its ports with the
      # system compiler either way, so the binary cache is shared.
      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-bincache-ubuntu-24.04-${{ steps.vcpkg_baseline.outputs.sha }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-ubuntu-24.04-${{ steps.vcpkg_baseline.outputs.sha }}-
            vcpkg-bincache-ubuntu-24.04-
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install LLVM Clang and its libFuzzer runtime
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: Configure (libFuzzer)
        run: >
          cmake -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBOMWERK_PRO=OFF
          -DBOMWERK_FUZZ=ON
          -DCMAKE_CXX_COMPILER=clang++-18
      - name: Build the harnesses
        run: cmake --build build-fuzz --target fuzzers --parallel
      # The nightly saves one corpus per shard; all four extract into one tree.
      - name: Restore the nightly corpus (shard 0)
        uses: actions/cache/restore@v4
        with:
          path: .fuzz-corpus
          key: fuzz-corpus-shard0-none
          restore-keys: fuzz-corpus-shard0-
      - name: Restore the nightly corpus (shard 1)
        uses: actions/cache/restore@v4
        with:
          path: .fuzz-corpus
          key: fuzz-corpus-shard1-none
          restore-keys: fuzz-corpus-shard1-
      - name: Restore the nightly corpus (shard 2)
        uses: actions/cache/restore@v4
        with:
          path: .fuzz-corpus
          key: fuzz-corpus-shard2-none
          restore-keys: fuzz-corpus-shard2-
      - name: Restore the nightly corpus (shard 3)
        uses: actions/cache/restore@v4
        with:
          path: .fuzz-corpus
          key: fuzz-corpus-shard3-none
          restore-keys: fuzz-corpus-shard3-
      - name: Fuzz every harness for ten minutes
        run: >
          python3 scripts/run_fuzz.py --build-dir build-fuzz
          --corpus-root .fuzz-corpus --artifacts-dir fuzz-artifacts
          --budget-seconds 600 --jobs 4
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-findings
          path: fuzz-artifacts/
          retention-days: 14

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The ubuntu-24.04 runner image ships clang-format-18 preinstalled
      # (actions/runner-images), so prefer it and skip apt-get entirely: a
      # resolver outage on the Ubuntu/Azure apt mirror can otherwise fail
      # this job, and only this job, on every pull request, since it is the
      # one package here actually fetched over the network rather than
      # already present on the image. Only fall back to installing the
      # distribution's clang-format package if a future image drops it.
      - name: Locate clang-format, installing it only if the image lacks it
        run: |
          if command -v clang-format-18 >/dev/null 2>&1; then
            echo "CF=clang-format-18" >> "$GITHUB_ENV"
          elif command -v clang-format >/dev/null 2>&1; then
            echo "CF=clang-format" >> "$GITHUB_ENV"
          else
            sudo apt-get update && sudo apt-get install -y clang-format
            echo "CF=clang-format" >> "$GITHUB_ENV"
          fi
      - run: ./scripts/check-format.sh "$CF"
