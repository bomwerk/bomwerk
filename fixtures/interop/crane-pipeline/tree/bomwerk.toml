# metadata.manufacturer and the sbom.cra.json sidecar both carry them.
[cra]
manufacturer_name = "Acme Corp"
manufacturer_email = "legal@acme.example"
security_contact = "security@acme.example"
vulnerability_disclosure_url = "https://acme.example/security"
